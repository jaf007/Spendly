{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}

<section class="analytics-section">
    <div class="analytics-card">
        <div class="analytics-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>

        <span class="analytics-badge">Coming soon</span>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-copy">
            We're working on powerful insights and visualisations to help you understand your spending patterns better.
        </p>

        <div class="analytics-dots">
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
            <span class="analytics-dot analytics-dot-active"></span>
        </div>

        <p class="analytics-footnote">We're crafting something special</p>
    </div>
</section>

{% endblock %}
